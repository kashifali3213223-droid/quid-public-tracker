<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUID Live Tracker</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0; font-family: Inter, Arial, sans-serif;
  background: #0b0d12; color: #f5f7fb;
}
.wrap { max-width: 1100px; margin: auto; padding: 28px 18px 50px; }
header { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom:24px; }
h1 { margin:0 0 6px; font-size:32px; }
.sub { color:#9aa3b2; }
.live { white-space:nowrap; padding:9px 12px; border:1px solid #263044; border-radius:999px; color:#9fe6b8; }
.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:22px; }
.card { background:#121620; border:1px solid #222a3a; border-radius:16px; padding:20px; }
.label { color:#8e98aa; font-size:13px; margin-bottom:8px; }
.value { font-size:28px; font-weight:700; }
.search { display:flex; gap:10px; margin-bottom:22px; }
input {
  flex:1; background:#0f131c; color:#fff; border:1px solid #2a3345;
  border-radius:10px; padding:13px 14px; font-size:15px;
}
button {
  border:0; border-radius:10px; padding:0 18px; font-weight:700; cursor:pointer;
}
.result { min-height:70px; margin-bottom:22px; }
.table-wrap { overflow:auto; border:1px solid #222a3a; border-radius:14px; }
table { width:100%; border-collapse:collapse; min-width:700px; }
th, td { text-align:left; padding:13px 14px; border-bottom:1px solid #202737; }
th { color:#8e98aa; font-size:12px; text-transform:uppercase; }
td { font-size:14px; }
.wallet { font-family:monospace; }
.note { color:#7f899a; font-size:12px; margin-top:12px; }
@media (max-width:650px) {
  header { flex-direction:column; }
  .grid { grid-template-columns:1fr; }
  .search { flex-direction:column; }
  button { height:44px; }
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>🔥 QUID Live Tracker</h1>
    <div class="sub">PancakeSwap V3 · QUID pairs · live wallet volume</div>
  </div>
  <div class="live" id="status">Connecting…</div>
</header>

<section class="grid">
  <div class="card">
    <div class="label">TOTAL WALLETS</div>
    <div class="value" id="walletCount">0</div>
  </div>
  <div class="card">
    <div class="label">TOTAL VOLUME USD</div>
    <div class="value" id="totalVolume">$0.00</div>
  </div>
</section>

<div class="card">
  <div class="label">SEARCH WALLET</div>
  <div class="search">
    <input id="address" placeholder="0x wallet address">
    <button onclick="searchWallet()">Search</button>
  </div>
  <div class="result" id="result"></div>
</div>

<div style="height:18px"></div>

<div class="card">
  <div class="label">LIVE WALLET RANKING</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Rank</th><th>Wallet</th><th>Swaps</th><th>Volume USD</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="note">Updates automatically every 3 seconds.</div>
</div>
</div>

<script>
const money = n => "$" + Number(n || 0).toLocaleString(undefined, {
  minimumFractionDigits: 2, maximumFractionDigits: 2
});

async function refresh() {
  try {
    const r = await fetch("/api/stats", {cache:"no-store"});
    const d = await r.json();
    document.getElementById("walletCount").textContent = d.total_wallets;
    document.getElementById("totalVolume").textContent = money(d.total_volume_usd);
    document.getElementById("status").textContent = d.tracker_running ? "🟢 LIVE" : "🔴 OFFLINE";

    document.getElementById("rows").innerHTML = d.wallets.map(x => `
      <tr>
        <td>#${x.rank}</td>
        <td class="wallet">${x.wallet}</td>
        <td>${x.swaps}</td>
        <td>${money(x.volume_usd)}</td>
      </tr>`).join("");
  } catch(e) {
    document.getElementById("status").textContent = "🔴 OFFLINE";
  }
}

async function searchWallet() {
  const address = document.getElementById("address").value.trim();
  if (!address) return;
  const result = document.getElementById("result");
  result.textContent = "Searching…";

  try {
    const r = await fetch("/api/wallet?address=" + encodeURIComponent(address), {cache:"no-store"});
    const d = await r.json();
    if (!d.found) {
      result.innerHTML = `<div class="sub">Wallet not found in the current tracker session.</div>`;
      return;
    }
    result.innerHTML = `
      <div class="card" style="padding:16px">
        <div class="label">WALLET</div>
        <div class="wallet">${d.wallet}</div>
        <div style="margin-top:12px"><b>${d.swaps}</b> swaps · <b>${money(d.volume_usd)}</b> volume</div>
      </div>`;
  } catch(e) {
    result.textContent = "Search failed.";
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
  </html>
